spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale_db
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 25
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        prefetch: 10